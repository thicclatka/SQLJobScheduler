[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "sqljobscheduler"
version = "0.1.2"
description = "SQL based job scheduler to handle GPU jobs"
authors = [{ name = "Alex Hurowitz" }]
readme = "README.md"
keywords = ["sql", "scheduler", "gpu", "job scheduler"]
requires-python = ">=3.11"
dependencies = [
  "altair>=6.0.0",
  "cryptography>=46.0.7",
  "easygui>=0.98.3",
  "fastapi>=0.68.0",
  "jinja2>=3.1.6",
  "libtmux>=0.28.0",
  "pandas==3.0.2",
  "psutil>=7.2.2",
  "python-multipart>=0.0.5",
  "streamlit>=1.51.0",
  "tabulate>=0.9.0",
  "tomli>=2.0.0",
  "uvicorn>=0.15.0",
]


[tool.setuptools.packages.find]
where = ["src"]
